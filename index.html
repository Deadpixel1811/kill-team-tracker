<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kill Team Score Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8e5da;--card:#f5f3ea;--ink:#232a1f;--mute:#6b7060;--line:#cbc7b6;--accent:#9a3b1e;--onaccent:#fff;--lead:#c9a24b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171c1e;--card:#222a2d;--ink:#e8e6dc;--mute:#9aa093;--line:#38423f;--accent:#d08a3c;--onaccent:#171c1e;--lead:#d08a3c}}
:root[data-theme="dark"]{--bg:#171c1e;--card:#222a2d;--ink:#e8e6dc;--mute:#9aa093;--line:#38423f;--accent:#d08a3c;--onaccent:#171c1e;--lead:#d08a3c}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.4 Barlow,system-ui,sans-serif}
main{max-width:1200px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
h1{font:700 28px/1 "Barlow Condensed",Impact,sans-serif;letter-spacing:.02em;margin:0}
.bar,.ctl{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ctl{margin-bottom:10px}
button{font:inherit;cursor:pointer;color:var(--ink);background:transparent;border:1.5px solid var(--line);border-radius:6px;padding:6px 12px;min-height:40px}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
.primary,[aria-pressed="true"]{background:var(--accent);color:var(--onaccent);border-color:var(--accent);font-weight:600}
.chip{min-width:44px}
.hint{margin:0 0 12px;color:var(--mute);font-size:14px}
.banner{background:var(--card);border:2px solid var(--lead);border-radius:8px;padding:12px 14px;margin-bottom:12px;font:700 24px/1.2 "Barlow Condensed",sans-serif}
.banner small{display:block;font:500 14px Barlow,sans-serif;color:var(--mute);margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:14px}
.card.lead{border-color:var(--lead);box-shadow:inset 0 4px 0 var(--lead)}
.top{display:flex;align-items:center;gap:8px}
.name{flex:1;min-width:0;font:700 20px "Barlow Condensed",sans-serif;background:transparent;color:var(--ink);border:0;border-bottom:1.5px solid var(--line);padding:6px 2px}
.team{width:100%;font:inherit;font-size:14px;background:transparent;color:var(--mute);border:0;border-bottom:1px solid var(--line);padding:6px 2px}
.x{min-height:34px;padding:2px 10px;color:var(--mute)}
.total{display:flex;align-items:center;justify-content:space-between;margin:8px 0}
.total b{font:700 60px/1 "Barlow Condensed",sans-serif}
.total span,small{color:var(--mute)}
.cp{display:flex;align-items:center;gap:6px}
.rd{border-top:1px solid var(--line);padding:8px 0}
.rd.now{box-shadow:inset 3px 0 0 var(--accent);padding-left:8px}
.rh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.rh label{flex:1;color:var(--mute)}
.rs{font:700 22px "Barlow Condensed",sans-serif}
.first{min-width:54px;min-height:34px;padding:2px 10px;font-size:14px;color:var(--mute)}
.first[aria-pressed="true"]{color:var(--onaccent)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
small{display:block;font-size:13px}
.step{display:flex;align-items:center;gap:4px}
.step button{width:36px;min-height:36px;padding:0;font-size:20px;line-height:1}
.step output{min-width:28px;text-align:center;font:700 22px "Barlow Condensed",sans-serif}
.add{margin-top:12px;width:100%}
input::placeholder{color:var(--mute)}
</style>
</head>
<body>
<main>
<header>
<h1>Kill Team Score Tracker</h1>
<div class="bar">
<button id="undo">Undo</button><button id="result">Show result</button><button id="reset">Reset scores</button><button id="newg">New game</button><button id="awake">Screen on</button>
</div>
</header>
<div id="ctl" class="ctl"></div>
<p id="msg" class="hint"></p>
<div id="banner"></div>
<div id="grid" class="grid"></div>
<button id="add" class="add primary">Add player</button>
</main>
<script>
const R=5,MAX=4,KEY="killteam-tracker-v2",$=id=>document.getElementById(id);
const blank=()=>({name:"",team:"",cp:0,s:Array.from({length:R},()=>[0,0])});
const emptyOrder=()=>Array.from({length:R},()=>[]);
let S={players:[blank(),blank()],order:emptyOrder(),cur:0,done:false,awake:true},hist=[],msg="";
try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.players)&&d.players.length>=1&&d.players.length<=MAX&&Array.isArray(d.order)&&d.order.length===R)S=Object.assign(S,d)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
function mut(fn){hist.push(JSON.stringify(S));if(hist.length>50)hist.shift();msg="";fn();save();render()}
const tot=p=>p.s.flat().reduce((a,b)=>a+b,0),rt=(p,r)=>p.s[r][0]+p.s[r][1];
const nm=(p,i)=>p.name.trim()||"Player "+(i+1);
const ord=n=>n+(["th","st","nd","rd"][n]||"th");
const esc=t=>t.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const st=(a,v)=>`<div class="step"><button ${a} data-d="-1" aria-label="Decrease">−</button><output>${v}</output><button ${a} data-d="1" aria-label="Increase">+</button></div>`;
function roll(){mut(()=>{let rl;do{rl=S.players.map(()=>1+Math.floor(Math.random()*6))}while(new Set(rl).size<rl.length);
S.order[S.cur]=rl.map((v,i)=>i).sort((a,b)=>rl[b]-rl[a]);
msg=`Round ${S.cur+1} roll (highest goes first): `+S.players.map((p,i)=>`${nm(p,i)} ${rl[i]}`).join(", ")})}
function render(){
  const P=S.players,T=P.map(tot),top=Math.max(...T);
  $("ctl").innerHTML=`<b>Round</b>`+Array.from({length:R},(_,r)=>`<button class="chip" data-c="${r}" aria-pressed="${S.cur===r}">${r+1}</button>`).join("")+`<button class="primary" id="roll">Roll initiative</button>`;
  $("ctl").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{S.cur=+b.dataset.c;save();render()});
  $("roll").onclick=roll;
  $("msg").textContent=msg||"Pick the current round, then roll initiative or tap Turn on each player in turn order.";
  $("undo").disabled=!hist.length;
  $("result").textContent=S.done?"Hide result":"Show result";
  $("awake").setAttribute("aria-pressed",S.awake);$("awake").textContent="Screen on: "+(S.awake?"yes":"no");
  if(S.done){const w=P.map((p,i)=>i).filter(i=>T[i]===top);
    $("banner").innerHTML=`<div class="banner">${w.length>1?"Tie: "+w.map(i=>esc(nm(P[i],i))).join(" and "):esc(nm(P[w[0]],w[0]))+" wins"} with ${top} VP<small>${w.length>1?"Agree a tie-breaker. CP left is shown on each card.":"Final scores: "+P.map((p,i)=>esc(nm(p,i))+" "+T[i]).join(", ")}</small></div>`}
  else $("banner").innerHTML="";
  const g=$("grid");g.innerHTML="";
  P.forEach((p,i)=>{
    const c=document.createElement("div");
    c.className="card"+(top>0&&T[i]===top&&T.filter(t=>t===top).length===1?" lead":"");
    c.innerHTML=`<div class="top"><input class="name" data-f="name" aria-label="Player ${i+1} name" placeholder="Player ${i+1}" maxlength="24" value="${esc(p.name)}"><button class="x" aria-label="Remove player" ${P.length<2?"disabled":""}>Remove</button></div>
    <input class="team" data-f="team" aria-label="Player ${i+1} kill team" placeholder="Kill team" maxlength="30" value="${esc(p.team)}">
    <div class="total"><div><b>${T[i]}</b> <span>VP</span></div><div class="cp"><span>CP</span>${st('data-k="cp"',p.cp)}</div></div>`+
    p.s.map((v,r)=>{const o=S.order[r],has=o.includes(i);
      return `<div class="rd${r===S.cur?" now":""}"><div class="rh"><label>Round ${r+1}</label><span class="rs">${rt(p,r)}</span><button class="first" data-r="${r}" aria-pressed="${has}" aria-label="Round ${r+1}: set turn order for player ${i+1}">${has?ord(o.indexOf(i)+1):"Turn"}</button></div><div class="pair"><div><small>Primary</small>${st(`data-k="0" data-r="${r}"`,v[0])}</div><div><small>Secondary</small>${st(`data-k="1" data-r="${r}"`,v[1])}</div></div></div>`}).join("");
    c.querySelectorAll("input").forEach(el=>el.oninput=e=>{p[el.dataset.f]=e.target.value;save()});
    c.querySelector(".x").onclick=()=>mut(()=>{P.splice(i,1);S.order=S.order.map(a=>a.filter(v=>v!==i).map(v=>v>i?v-1:v))});
    c.querySelectorAll(".first").forEach(b=>b.onclick=()=>mut(()=>{const o=S.order[+b.dataset.r],k=o.indexOf(i);if(k>=0)o.splice(k,1);else o.push(i)}));
    c.querySelectorAll(".step button").forEach(b=>b.onclick=()=>mut(()=>{const d=+b.dataset.d,k=b.dataset.k;
      if(k==="cp")p.cp=Math.max(0,p.cp+d);else{const r=+b.dataset.r;p.s[r][+k]=Math.max(0,p.s[r][+k]+d)}}));
    g.appendChild(c);
  });
  $("add").disabled=P.length>=MAX;
}
$("add").onclick=()=>mut(()=>S.players.push(blank()));
$("undo").onclick=()=>{if(hist.length){S=JSON.parse(hist.pop());msg="";save();render()}};
$("result").onclick=()=>{S.done=!S.done;save();render()};
$("reset").onclick=()=>{if(confirm("Reset all scores, CP and turn orders? Names are kept."))mut(()=>{S.players.forEach(p=>{p.s=blank().s;p.cp=0});S.order=emptyOrder();S.cur=0;S.done=false})};
$("newg").onclick=()=>{if(confirm("Start a new game? This clears names, teams and scores."))mut(()=>{S={players:[blank(),blank()],order:emptyOrder(),cur:0,done:false,awake:S.awake}})};
let wl=null;
async function wake(){try{if(S.awake&&"wakeLock"in navigator&&!wl&&document.visibilityState==="visible"){wl=await navigator.wakeLock.request("screen");wl.addEventListener("release",()=>{wl=null})}else if(!S.awake&&wl){await wl.release();wl=null}}catch(e){wl=null}}
$("awake").onclick=()=>{S.awake=!S.awake;save();render();wake()};
document.addEventListener("visibilitychange",wake);document.addEventListener("pointerdown",wake);
render();wake();
</script>
</body>
</html>
